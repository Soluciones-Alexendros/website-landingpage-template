# Jobs secrets + sca. Cada SHA de 40 hex corresponde a la versión etiquetada revisada.
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Binario gitleaks (no la action de pago). Checksum release v8.30.1.
      - name: gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose

  sca:
    name: sca
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Auditoría nativa (prod, nivel high)
        run: pnpm audit --prod --audit-level=high

      # OSV sobre el lockfile. Solo high/critical hacen fallar (moderate no tumba la plantilla).
      # Binario pinneado v1.9.0 + checksum del release.
      - name: OSV-Scanner (lockfile, high+)
        run: |
          set -euo pipefail
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.0/osv-scanner_linux_amd64
          EXPECTED="$(curl -sSfL https://github.com/google/osv-scanner/releases/download/v1.9.0/osv-scanner_SHA256SUMS | awk '/osv-scanner_linux_amd64$/ {print $1}')"
          echo "${EXPECTED}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          set +e
          ./osv-scanner scan --lockfile=pnpm-lock.yaml --format=json --output=osv-report.json
          set -e
          test -f osv-report.json
          python3 scripts/osv-fail-on-high.py osv-report.json
