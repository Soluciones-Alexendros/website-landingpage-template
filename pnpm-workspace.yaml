packages:
  - "apps/*"
  - "packages/*"

# Builds nativos permitidos (deps con scripts de compilación).
# Las entradas de Prisma se añadirán cuando se cablee el driver Postgres.
allowBuilds:
  sharp: true
  unrs-resolver: true
  "@tailwindcss/oxide": true
  esbuild: true

# Fuerza parches de seguridad en transitivos (pnpm ≥11: settings en este fichero).
overrides:
  undici: "^8.12.3"
  source-map-js: "^1.2.2"
